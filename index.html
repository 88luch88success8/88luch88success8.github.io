<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>6even Screen Translator</title>
  <meta name="description" content="Official developer page for 6even Screen Translator (Android).">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #e2e8f0;
      --accent: #2563eb;
      --code-bg: #f1f5f9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f8fafc;
        --muted: #94a3b8;
        --border: #334155;
        --accent: #60a5fa;
        --code-bg: #0f172a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 48px 16px;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px 24px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
      line-height: 1.25;
    }
    p {
      margin: 0 0 16px;
      color: var(--muted);
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 20px 0;
    }
    a.btn {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }
    a.btn:hover {
      border-color: var(--accent);
    }
    .meta {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 0.875rem;
      color: var(--muted);
    }
    code.ads-line {
      display: block;
      margin-top: 8px;
      padding: 10px 12px;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.82rem;
      color: var(--text);
      overflow-x: auto;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main>
    <h1>6even Screen Translator</h1>
    <p>Official developer website for the <strong>6even Screen Translator</strong> Android application.</p>

    <nav aria-label="Developer resources">
      <a class="btn" href="https://88luch88success8.github.io/6even-privacy-policy/">Privacy Policy</a>
      <a class="btn" href="/app-ads.txt">app-ads.txt</a>
    </nav>

    <section class="meta" aria-label="App-ads.txt verification">
      <div>Authorized Digital Sellers (<code>app-ads.txt</code>):</div>
      <code class="ads-line">google.com, pub-9794174303733142, DIRECT, f08c47fec0942fa0</code>
    </section>
  </main>
</body>
</html>
